# Локальный запуск бэкенда целиком: база, приложение, инструменты.
#
#   make up      — поднять всё
#   make logs    — логи приложения
#   make reset   — снести вместе с данными (сиды применяются на пустой базе)
#
# Порты вынесены в переменные и читаются из dev/.env, если он есть;
# без него берутся значения по умолчанию — файл заводить не обязательно.

name: sdlc-pipeline

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sdlc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdlc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdlc}
      POSTGRES_DB: ${POSTGRES_DB:-sdlc}
    ports:
      # 55432, а не 5432: у разработчика обычно уже занят локальным Postgres.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdlc} -d ${POSTGRES_DB:-sdlc}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      # Контекст — корень репозитория: в образ должны попасть migrations/,
      # они встраиваются в бинарник.
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: sdlc-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SDLC_DATABASE_URL: postgres://${POSTGRES_USER:-sdlc}:${POSTGRES_PASSWORD:-sdlc}@postgres:5432/${POSTGRES_DB:-sdlc}?sslmode=disable
      SDLC_HTTP_ADDR: ":8080"
      SDLC_ENV: development
      SDLC_LOG_LEVEL: ${SDLC_LOG_LEVEL:-info}
      # Схема накатывается самим приложением на старте.
      SDLC_AUTO_MIGRATE: "true"
      # Демонстрационный проект: цикл из восьми статусов, пять ролей, гейты,
      # эпик с тремя задачами. Применяется только на пустой базе.
      SDLC_SEED: ${SDLC_SEED:-default_workflow}
      # Гейт external_check появится в фазе 3 и до тех пор переход не держит.
      # Для продакшена значение обратное — иначе цикл проходится мимо
      # непроверенных условий.
      SDLC_STRICT_GATES: ${SDLC_STRICT_GATES:-false}
      # Аутентификация (решение 0021). header — актор из заголовка, права не
      # проверяются: режим отладки цикла. token — только токены, права по
      # участию в проекте; первый администратор — из SDLC_ADMIN_TOKEN.
      SDLC_AUTH_MODE: ${SDLC_AUTH_MODE:-header}
      SDLC_ADMIN_HANDLE: ${SDLC_ADMIN_HANDLE:-admin}
      SDLC_ADMIN_TOKEN: ${SDLC_ADMIN_TOKEN:-}
      SDLC_DEFAULT_ACTOR: ${SDLC_DEFAULT_ACTOR:-local-dev}
      # Кто заводит проекты (решение 0030): open — любой вошедший, teams —
      # администратор системы и лиды команд с правом на это.
      SDLC_PROJECT_CREATION: ${SDLC_PROJECT_CREATION:-open}
      # Вход через GitHub: OAuth-учётные данные того же GitHub App. Без них
      # страница входа показывает только провайдера и токен.
      SDLC_GITHUB_URL: ${SDLC_GITHUB_URL:-https://github.com}
      SDLC_GITHUB_APP_CLIENT_ID: ${SDLC_GITHUB_APP_CLIENT_ID:-}
      SDLC_GITHUB_APP_CLIENT_SECRET: ${SDLC_GITHUB_APP_CLIENT_SECRET:-}
      # Вебхуки GitHub: без секрета ручка /webhooks/github выключена.
      SDLC_GITHUB_WEBHOOK_SECRET: ${SDLC_GITHUB_WEBHOOK_SECRET:-}
      # Крупное содержимое артефактов и документов уходит на том, в базе
      # остаётся адрес. Том общий с воркером: он читает документы при
      # векторизации.
      SDLC_BLOB_DIR: /blobs
      # Объектное хранилище вместо тома: нужно, когда реплик api несколько и
      # общего тома между ними нет. Заданный бакет перекрывает SDLC_BLOB_DIR.
      # Локально поднимается профилем s3, см. dev/README.md.
      SDLC_BLOB_S3_BUCKET: ${SDLC_BLOB_S3_BUCKET:-}
      SDLC_BLOB_S3_ENDPOINT: ${SDLC_BLOB_S3_ENDPOINT:-}
      SDLC_BLOB_S3_REGION: ${SDLC_BLOB_S3_REGION:-}
      SDLC_BLOB_S3_PREFIX: ${SDLC_BLOB_S3_PREFIX:-}
      SDLC_BLOB_S3_ACCESS_KEY_ID: ${SDLC_BLOB_S3_ACCESS_KEY_ID:-}
      SDLC_BLOB_S3_SECRET_ACCESS_KEY: ${SDLC_BLOB_S3_SECRET_ACCESS_KEY:-}
      # MCP-сервер для локальных агентов: /mcp/projects/{PROJECT}.
      SDLC_MCP_ENABLED: ${SDLC_MCP_ENABLED:-true}
      # Аренда задачи: сколько живёт без heartbeat и как часто его слать.
      SDLC_LEASE_TTL: ${SDLC_LEASE_TTL:-30m}
      SDLC_HEARTBEAT_INTERVAL: ${SDLC_HEARTBEAT_INTERVAL:-5m}
      # Эмбеддинги. Без ключа провайдер выключается сам, и поиск остаётся
      # полнотекстовым: это рабочий режим, а не поломка. hash — детерминированная
      # заглушка для локальной проверки проводки, семантики в ней нет.
      SDLC_EMBEDDINGS_PROVIDER: ${SDLC_EMBEDDINGS_PROVIDER:-}
      SDLC_VOYAGE_API_KEY: ${SDLC_VOYAGE_API_KEY:-}
      SDLC_EMBEDDINGS_MODEL: ${SDLC_EMBEDDINGS_MODEL:-voyage-code-3}
    volumes:
      - blobs:/blobs
    ports:
      # 8088, а не 8080: восьмидесятый на машине разработчика обычно занят.
      - "${API_PORT:-8088}:8080"
    healthcheck:
      # В образе нет shell и curl — пробу делает сам бинарник.
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Фоновые задания: протухшие аренды, инкрементальная индексация репозиториев
  # с детектором дрейфа, синхронизация PR и векторизация артефактов. Отдельный
  # процесс, а не горутина в api: реплик api может быть несколько, и каждая
  # гоняла бы свой проход. Миграции воркер не катит — схему поднимает api.
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: sdlc-worker
    entrypoint: ["/worker"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      SDLC_DATABASE_URL: postgres://${POSTGRES_USER:-sdlc}:${POSTGRES_PASSWORD:-sdlc}@postgres:5432/${POSTGRES_DB:-sdlc}?sslmode=disable
      SDLC_ENV: development
      SDLC_LOG_LEVEL: ${SDLC_LOG_LEVEL:-info}
      SDLC_AUTO_MIGRATE: "false"
      # Обе величины обязаны совпадать с настройками api: воркер решает,
      # что аренда протухла, по тем же правилам, по которым api её выдаёт.
      SDLC_LEASE_TTL: ${SDLC_LEASE_TTL:-30m}
      SDLC_HEARTBEAT_INTERVAL: ${SDLC_HEARTBEAT_INTERVAL:-5m}
      SDLC_LEASE_SWEEP_INTERVAL: ${SDLC_LEASE_SWEEP_INTERVAL:-1m}
      # Индексация репозиториев. Без токена GitHub прогон не поставится:
      # репозитории демо-проекта приватные, и воркер честно скажет об этом
      # в логе, а остальные задания продолжат работать.
      SDLC_INDEX_ENABLED: ${SDLC_INDEX_ENABLED:-true}
      # Минута, а не пять: локально хочется видеть индексацию сразу после
      # пуша, а три запроса в минуту лимиты GitHub не замечают.
      SDLC_INDEX_INTERVAL: ${SDLC_INDEX_INTERVAL:-1m}
      # Очередь прогонов смотрится чаще: туда кладёт коммиты вебхук.
      SDLC_INDEX_POLL_INTERVAL: ${SDLC_INDEX_POLL_INTERVAL:-15s}
      SDLC_INDEX_RETAIN_RUNS: ${SDLC_INDEX_RETAIN_RUNS:-5}
      SDLC_BLOB_DIR: /blobs
      # То же хранилище, что у api: воркер читает вынесенное содержимое при
      # векторизации, и разъехаться им нельзя.
      SDLC_BLOB_S3_BUCKET: ${SDLC_BLOB_S3_BUCKET:-}
      SDLC_BLOB_S3_ENDPOINT: ${SDLC_BLOB_S3_ENDPOINT:-}
      SDLC_BLOB_S3_REGION: ${SDLC_BLOB_S3_REGION:-}
      SDLC_BLOB_S3_PREFIX: ${SDLC_BLOB_S3_PREFIX:-}
      SDLC_BLOB_S3_ACCESS_KEY_ID: ${SDLC_BLOB_S3_ACCESS_KEY_ID:-}
      SDLC_BLOB_S3_SECRET_ACCESS_KEY: ${SDLC_BLOB_S3_SECRET_ACCESS_KEY:-}
      SDLC_GITHUB_TOKEN: ${SDLC_GITHUB_TOKEN:-}
      SDLC_GITHUB_API_URL: ${SDLC_GITHUB_API_URL:-https://api.github.com}
      # Те же настройки эмбеддингов, что у api: индекс считает воркер, вектор
      # поискового запроса — api, и модель у них обязана быть одна.
      SDLC_EMBEDDINGS_PROVIDER: ${SDLC_EMBEDDINGS_PROVIDER:-}
      SDLC_VOYAGE_API_KEY: ${SDLC_VOYAGE_API_KEY:-}
      SDLC_EMBEDDINGS_MODEL: ${SDLC_EMBEDDINGS_MODEL:-voyage-code-3}
    volumes:
      - blobs:/blobs
    restart: unless-stopped

  # Объектное хранилище для проверки S3-режима: docker compose --profile s3 up -d
  # Само по себе ничего не меняет — api и воркер пойдут в него, только когда
  # в dev/.env задан SDLC_BLOB_S3_BUCKET (см. dev/README.md).
  minio:
    image: minio/minio:latest
    container_name: sdlc-minio
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SDLC_BLOB_S3_ACCESS_KEY_ID:-sdlc}
      MINIO_ROOT_PASSWORD: ${SDLC_BLOB_S3_SECRET_ACCESS_KEY:-sdlcsdlc}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio:/data
    restart: unless-stopped

  # Бакет заводится отдельным шагом: сервис сам его не создаёт, а получать
  # NoSuchBucket на первом же артефакте неинтересно.
  minio-init:
    image: minio/mc:latest
    container_name: sdlc-minio-init
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$${SDLC_BLOB_S3_BUCKET:-sdlc-blobs}"
    environment:
      MINIO_ROOT_USER: ${SDLC_BLOB_S3_ACCESS_KEY_ID:-sdlc}
      MINIO_ROOT_PASSWORD: ${SDLC_BLOB_S3_SECRET_ACCESS_KEY:-sdlcsdlc}
      SDLC_BLOB_S3_BUCKET: ${SDLC_BLOB_S3_BUCKET:-}

  # Просмотр базы руками: docker compose --profile tools up -d
  adminer:
    image: adminer:4
    container_name: sdlc-adminer
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8089}:8080"
    restart: unless-stopped

volumes:
  pgdata:
  # Вынесенное содержимое артефактов и документов; общий для api и воркера.
  blobs:
  minio:
