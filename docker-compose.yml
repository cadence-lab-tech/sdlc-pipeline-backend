services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sdlc-postgres
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: sdlc
      POSTGRES_DB: sdlc
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc -d sdlc"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
