# Продовый стек sdlc-pipeline на одной машине.
#
# Лежит на сервере в /opt/sdlc вместе с Caddyfile и .env; образы собирают
# workflow'ы двух репозиториев и кладут в GHCR. Выкладка — deploy.sh.
#
# Наружу торчит только Caddy. Postgres, api, воркер и интерфейс общаются по
# внутренней docker-сети и портов на хост не публикуют: пробросить 5432 на
# машину с белым IP означает отдать базу интернету.

name: sdlc

services:
  # Переезд с PostgreSQL 17 на 18 тем же механизмом, что в пакете
  # self-hosted (CLAB-237, docs/admin.md пакета, «PostgreSQL 18»): два
  # одноразовых сервиса перед postgres. pg-upgrade-dump образом 17 снимает
  # pg_dumpall с прежнего тома pgdata, pg-upgrade-load грузит его в новый
  # кластер 18 в томе postgres и ставит метку последней; postgres ждёт обоих.
  # После переезда и на каждом следующем `up -d` оба выходят сразу. Том
  # pgdata только читается и остаётся для отката; скрипт —
  # deploy/postgres/major-upgrade.sh, копия файла пакета (deploy.yml
  # кладёт его в /opt/sdlc/postgres).
  pg-upgrade-dump:
    image: pgvector/pgvector:pg17
    entrypoint: ["bash", "/cadence/major-upgrade.sh", "dump"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - postgres:/target
      - ./postgres/major-upgrade.sh:/cadence/major-upgrade.sh:ro

  pg-upgrade-load:
    image: pgvector/pgvector:pg18-trixie
    entrypoint: ["bash", "/cadence/major-upgrade.sh", "load"]
    depends_on:
      pg-upgrade-dump:
        condition: service_completed_successfully
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/major-upgrade.sh:/cadence/major-upgrade.sh:ro

  postgres:
    # Тот же образ, что в dev/ и в пакете: схема требует pgvector. Данные —
    # в /var/lib/postgresql/18/docker тома postgres: раскладка образов 18+.
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    depends_on:
      pg-upgrade-load:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Схему накатывает сам api при старте (SDLC_AUTO_MIGRATE): миграции
  # встроены в бинарник и разъехаться с версией сервиса не могут.
  api:
    image: ${IMAGE_BACKEND}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SDLC_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SDLC_HTTP_ADDR: ":8080"
      SDLC_ENV: production
      SDLC_LOG_LEVEL: ${SDLC_LOG_LEVEL:-info}
      SDLC_AUTO_MIGRATE: "true"
      SDLC_SEED: ${SDLC_SEED:-}
      # В проде гейт неизвестного типа обязан валить переход.
      SDLC_STRICT_GATES: "true"
      # Только токены и сессии: режим header — для отладки цикла у себя.
      SDLC_AUTH_MODE: token
      SDLC_ADMIN_HANDLE: ${SDLC_ADMIN_HANDLE:-admin}
      SDLC_ADMIN_TOKEN: ${SDLC_ADMIN_TOKEN}
      SDLC_BOOTSTRAP_TEAM: ${SDLC_BOOTSTRAP_TEAM:-}
      SDLC_BOOTSTRAP_TEAM_NAME: ${SDLC_BOOTSTRAP_TEAM_NAME:-}
      SDLC_PROJECT_CREATION: ${SDLC_PROJECT_CREATION:-open}
      SDLC_TENANCY: ${SDLC_TENANCY:-shared}
      SDLC_SESSION_TTL: ${SDLC_SESSION_TTL:-12h}
      # Вход людей: GitHub и, если есть, корпоративный провайдер.
      SDLC_GITHUB_URL: ${SDLC_GITHUB_URL:-https://github.com}
      SDLC_GITHUB_APP_CLIENT_ID: ${SDLC_GITHUB_APP_CLIENT_ID:-}
      SDLC_GITHUB_APP_CLIENT_SECRET: ${SDLC_GITHUB_APP_CLIENT_SECRET:-}
      SDLC_GITHUB_APP_SLUG: ${SDLC_GITHUB_APP_SLUG:-}
      SDLC_OIDC_ISSUER: ${SDLC_OIDC_ISSUER:-}
      SDLC_OIDC_CLIENT_ID: ${SDLC_OIDC_CLIENT_ID:-}
      SDLC_OIDC_GROUPS_CLAIM: ${SDLC_OIDC_GROUPS_CLAIM:-groups}
      # Доступ к репозиториям: GitHub App (ключ лежит в secrets/) либо токен.
      SDLC_GITHUB_API_URL: ${SDLC_GITHUB_API_URL:-https://api.github.com}
      SDLC_GITHUB_APP_ID: ${SDLC_GITHUB_APP_ID:-}
      SDLC_GITHUB_APP_KEY_FILE: ${SDLC_GITHUB_APP_KEY_FILE:-}
      SDLC_GITHUB_TOKEN: ${SDLC_GITHUB_TOKEN:-}
      SDLC_GITHUB_WEBHOOK_SECRET: ${SDLC_GITHUB_WEBHOOK_SECRET:-}
      # Крупное содержимое артефактов: бакет S3, а при пустом бакете — том.
      SDLC_BLOB_DIR: /blobs
      SDLC_BLOB_S3_BUCKET: ${SDLC_BLOB_S3_BUCKET:-}
      SDLC_BLOB_S3_ENDPOINT: ${SDLC_BLOB_S3_ENDPOINT:-}
      SDLC_BLOB_S3_REGION: ${SDLC_BLOB_S3_REGION:-}
      SDLC_BLOB_S3_PREFIX: ${SDLC_BLOB_S3_PREFIX:-}
      SDLC_BLOB_S3_ACCESS_KEY_ID: ${SDLC_BLOB_S3_ACCESS_KEY_ID:-}
      SDLC_BLOB_S3_SECRET_ACCESS_KEY: ${SDLC_BLOB_S3_SECRET_ACCESS_KEY:-}
      SDLC_MCP_ENABLED: "true"
      SDLC_LEASE_TTL: ${SDLC_LEASE_TTL:-30m}
      SDLC_HEARTBEAT_INTERVAL: ${SDLC_HEARTBEAT_INTERVAL:-5m}
      # Эмбеддинги: без ключа поиск остаётся полнотекстовым — это рабочий
      # режим, а не поломка. Модель обязана совпадать с воркером.
      SDLC_VOYAGE_API_KEY: ${SDLC_VOYAGE_API_KEY:-}
      SDLC_EMBEDDINGS_MODEL: ${SDLC_EMBEDDINGS_MODEL:-voyage-code-3}
    volumes:
      - blobs:/blobs
      - ./secrets:/secrets:ro
    healthcheck:
      # В образе нет shell и curl — пробу делает сам бинарник.
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Фоновые задания: аренды, индексация с детектором дрейфа, состояние PR,
  # векторизация. Тот же образ, другой entrypoint. Миграции не катит.
  worker:
    image: ${IMAGE_BACKEND}
    restart: unless-stopped
    entrypoint: ["/worker"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      SDLC_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SDLC_ENV: production
      SDLC_LOG_LEVEL: ${SDLC_LOG_LEVEL:-info}
      SDLC_AUTO_MIGRATE: "false"
      # Обе величины обязаны совпадать с api: воркер решает, что аренда
      # протухла, по тем же правилам, по которым api её выдаёт.
      SDLC_LEASE_TTL: ${SDLC_LEASE_TTL:-30m}
      SDLC_HEARTBEAT_INTERVAL: ${SDLC_HEARTBEAT_INTERVAL:-5m}
      SDLC_LEASE_SWEEP_INTERVAL: ${SDLC_LEASE_SWEEP_INTERVAL:-1m}
      SDLC_INDEX_ENABLED: ${SDLC_INDEX_ENABLED:-true}
      SDLC_INDEX_INTERVAL: ${SDLC_INDEX_INTERVAL:-5m}
      SDLC_INDEX_POLL_INTERVAL: ${SDLC_INDEX_POLL_INTERVAL:-15s}
      SDLC_INDEX_RETAIN_RUNS: ${SDLC_INDEX_RETAIN_RUNS:-5}
      SDLC_BLOB_DIR: /blobs
      SDLC_BLOB_S3_BUCKET: ${SDLC_BLOB_S3_BUCKET:-}
      SDLC_BLOB_S3_ENDPOINT: ${SDLC_BLOB_S3_ENDPOINT:-}
      SDLC_BLOB_S3_REGION: ${SDLC_BLOB_S3_REGION:-}
      SDLC_BLOB_S3_PREFIX: ${SDLC_BLOB_S3_PREFIX:-}
      SDLC_BLOB_S3_ACCESS_KEY_ID: ${SDLC_BLOB_S3_ACCESS_KEY_ID:-}
      SDLC_BLOB_S3_SECRET_ACCESS_KEY: ${SDLC_BLOB_S3_SECRET_ACCESS_KEY:-}
      # Сборка мусора в блобах: удаление проекта и репозитория блобы не
      # трогают — они общие по sha256, — и освобождать место больше некому.
      SDLC_BLOB_GC_ENABLED: ${SDLC_BLOB_GC_ENABLED:-true}
      SDLC_BLOB_GC_INTERVAL: ${SDLC_BLOB_GC_INTERVAL:-1h}
      SDLC_BLOB_GC_LIMIT: ${SDLC_BLOB_GC_LIMIT:-500}
      SDLC_BLOB_GC_MIN_AGE: ${SDLC_BLOB_GC_MIN_AGE:-24h}
      SDLC_BLOB_GC_DRY_RUN: ${SDLC_BLOB_GC_DRY_RUN:-false}
      # Вытеснение кэша эмбеддингов: без него таблица растёт монотонно —
      # ключ по содержимому, владельца нет, удаление проекта её не трогает.
      SDLC_EMBEDDING_CACHE_GC_ENABLED: ${SDLC_EMBEDDING_CACHE_GC_ENABLED:-true}
      SDLC_EMBEDDING_CACHE_GC_INTERVAL: ${SDLC_EMBEDDING_CACHE_GC_INTERVAL:-6h}
      SDLC_EMBEDDING_CACHE_TTL: ${SDLC_EMBEDDING_CACHE_TTL:-720h}
      SDLC_EMBEDDING_CACHE_MAX_ROWS: ${SDLC_EMBEDDING_CACHE_MAX_ROWS:-1000000}
      SDLC_EMBEDDING_CACHE_GC_LIMIT: ${SDLC_EMBEDDING_CACHE_GC_LIMIT:-10000}
      SDLC_EMBEDDING_CACHE_GC_DRY_RUN: ${SDLC_EMBEDDING_CACHE_GC_DRY_RUN:-false}
      SDLC_EMBEDDING_CACHE_TOUCH_AFTER: ${SDLC_EMBEDDING_CACHE_TOUCH_AFTER:-1h}
      # Срок хранения журнала действий в днях; 0 — хранить вечно.
      SDLC_AUDIT_RETENTION_DAYS: ${SDLC_AUDIT_RETENTION_DAYS:-180}
      SDLC_GITHUB_API_URL: ${SDLC_GITHUB_API_URL:-https://api.github.com}
      SDLC_GITHUB_APP_ID: ${SDLC_GITHUB_APP_ID:-}
      SDLC_GITHUB_APP_KEY_FILE: ${SDLC_GITHUB_APP_KEY_FILE:-}
      SDLC_GITHUB_TOKEN: ${SDLC_GITHUB_TOKEN:-}
      SDLC_VOYAGE_API_KEY: ${SDLC_VOYAGE_API_KEY:-}
      SDLC_EMBEDDINGS_MODEL: ${SDLC_EMBEDDINGS_MODEL:-voyage-code-3}
    volumes:
      - blobs:/blobs
      - ./secrets:/secrets:ro

  # Интерфейс — статика в Caddy на 80-м порту внутренней сети. Сборка
  # в репозитории интерфейса (Dockerfile там же).
  ui:
    image: ${IMAGE_FRONTEND}
    restart: unless-stopped

  # Единственная точка входа: TLS, интерфейс, /v1, /mcp и /webhooks.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SDLC_DOMAIN: ${SDLC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Здесь живут выписанные сертификаты. Без этого тома каждый
      # `docker compose down` заставляет Let's Encrypt выписывать их заново,
      # а у него недельные лимиты на домен.
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, ui]

volumes:
  # База: PostgreSQL 18.
  postgres:
  # База PostgreSQL 17 до CLAB-237: читается один раз при переезде, остаётся
  # для отката. Удалить, когда откат больше не нужен:
  #   docker compose rm -f pg-upgrade-dump && docker volume rm sdlc_pgdata
  pgdata:
  # Вынесенное содержимое при пустом SDLC_BLOB_S3_BUCKET; общий для api и воркера.
  blobs:
  caddy_data:
  caddy_config:
