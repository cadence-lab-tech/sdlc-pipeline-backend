# Базовые образы Dockerfile (CLAB-203, решение 0051). Оба FROM закреплены
# по digest; раз в неделю Dependabot открывает PR, если upstream
# переопубликовал тот же тег (новый патч Go в golang:1.26-alpine, пакеты
# Debian в distroless). PR проходит ci.yml со сборкой образа, человек сливает
# его напрямую после зелёного CI (docs/PROCESS.md).
#
# Смена линии тега — не автоматом: Go 1.27 и дальше — решение человека
# отдельной задачей, поэтому minor и major у golang игнорируются. У
# distroless тег nonroot версии не несёт — обновляется только digest;
# следующий debian — другое имя образа, его Dependabot не предложит.
#
# Кроме образов — только actions workflow'ов (CLAB-142, ниже).
#
# Политика целиком — решение 0051 («Уточнено CLAB-374»). Version updates (PR
# по расписанию) ведутся только для docker / и github-actions /. gomod
# (go.mod сервиса) — без version updates: его покрывают алерты и security
# updates Dependabot (включены в настройках репозитория), они сами открывают
# PR с исправлением. Алерт, у которого исправления нет, разбирается по
# достижимости: если сканер клиента его видит — утверждение в
# .github/release/openvex.json и строка «Known scanner findings» в
# docs/admin.md пакета self-hosted, затем dismiss tolerable_risk с
# комментарием; если нет — dismiss с причиной.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependabot"
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Actions workflow'ов закреплены по SHA (CLAB-142): тег можно
  # переписать, SHA — нет, и сам SHA без обновления протух бы. Dependabot
  # двигает SHA вместе с версией в комментарии; все actions — одним PR в
  # неделю, он проходит ci.yml, человек сливает после зелёного CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependabot"
    groups:
      github-actions:
        patterns:
          - "*"
