# Проверка кода на каждом pull request и на каждом push в main.
#
# Без секретов: прогон одинаков для ветки clab/* и для PR из форка, права
# токена — только чтение. Один job с закреплённым именем `backend` — это
# строка обязательной проверки в защите main (CLAB-142); шаги внутри можно
# менять, имя — нет. Выкладка (deploy.yml) ждёт зелёный прогон этого
# workflow'а для того же коммита.
#
# Фильтра по путям нет намеренно: обязательная проверка должна выставляться
# на любой PR, иначе PR с одной правкой документации повиснет в «expected».
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR: новый push отменяет прогон предыдущего коммита. main: нет — прогон на
# main ждёт deploy.yml, и отменённый он увидел бы как провал.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    # Раннер закреплён, а не ubuntu-latest: смена образа под ногами не
    # должна менять поведение проверки (CLAB-151).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Тот же образ, что в dev/docker-compose.yml: миграциям нужны pgcrypto
      # и vector. База выделенная — тест сносит в ней схему public целиком.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
          POSTGRES_DB: sdlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdlc -d sdlc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Кэш модулей и сборки по go.sum (значение по умолчанию, здесь —
          # чтобы было видно: второй прогон подряд печатает Cache restored).
          cache: true

      - run: make lint

      # Достижимые уязвимости в зависимостях и stdlib тулчейна из go.mod
      # (CLAB-169): находка роняет проверку. Модульные находки без вызова из
      # нашего кода govulncheck печатает только с -show verbose и не валит.
      # Базу берёт с vuln.go.dev без токена; новая запись в ней может
      # покраснить PR, который зависимости не трогал, — это и есть сигнал.
      # Версия закреплена: смена анализатора — отдельная правка.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # go test ./... целиком, с интеграционными: без SDLC_TEST_DATABASE_URL
      # они пропускаются (internal/testdb), а здесь база есть. Отдельный
      # make test продублировал бы модульные.
      - run: make test-integration
        env:
          SDLC_TEST_DATABASE_URL: postgres://sdlc:sdlc@localhost:5432/sdlc_test?sslmode=disable

      # Скрипт оповещения self-hosted о релизе (release.yml) проверяется без
      # сети: docker и gh подменены заглушками.
      - run: bash .github/release/notify-self-hosted.test.sh
      # Разбор govulncheck по бинарям образа (release.yml, CLAB-130) и VEX —
      # тоже без сети: govulncheck подменён заглушкой.
      - run: bash .github/release/govulncheck-binaries.test.sh
