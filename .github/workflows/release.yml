# Релиз по тегу v*: бинарники clab под три платформы с формулой в тап
# Homebrew и образ сервиса той же версии (задание image ниже).
#
# CLI ставят на машины разработчиков, где нет ни Go, ни доступа к GHCR, —
# поэтому не образ, а готовые архивы в GitHub Releases. Раздача публичная
# (решение 0038): архивы уходят релизом в публичный тап
# cadence-lab-tech/homebrew-tap, откуда их качают brew, install.sh и просто
# curl — без токена и без участия в организации. Здесь у релиза только
# заметки о том, что изменилось: архивы CLI живут в тапе.
#
# Цепочка поставки (CLAB-130, решение 0046): образ подписан cosign без
# ключей — сертификатом на OIDC-токен этого прогона, identity
# .../.github/workflows/release.yml@refs/tags/vX.Y.Z, — к нему приложены
# SBOM (SPDX), provenance (SLSA v1, mode=max) и VEX (openvex.json); подписан
# digest индекса, а с ним и манифесты аттестаций в индексе. checksums.txt
# архивов CLI подписан так же, бандл checksums.txt.sigstore.json уходит в
# релиз тапа рядом с архивами. Команды проверки для клиента — docs/admin.md
# в self-hosted, «Verifying a release».
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      # v7, как в ci.yml: v5 читает из go.mod только строку go (ставил бы
      # 1.26.0 и докачивал тулчейн сам), v7 берёт строку toolchain и ставит
      # GOTOOLCHAIN=local — сборка идёт ровно на тулчейне из go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Версия в бинарнике — имя тега, чтобы clab version отвечал тем же,
      # что и страница релиза.
      - name: собрать
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          name="clab_${version}_${GOOS}_${GOARCH}"
          mkdir -p dist/"$name"
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o dist/"$name"/clab"$ext" ./cmd/clab
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o dist/"$name"/clab-runner"$ext" ./cmd/clab-runner
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC-токен прогона — для подписи checksums.txt без ключей.
      id-token: write
    env:
      # Секреты в условии шага недоступны, поэтому флаг считается здесь.
      # Без токена заметки всё равно выходят — только архивы до тапа не
      # доедут и формула не обновится.
      HAS_TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN != '' }}
      TAP: cadence-lab-tech/homebrew-tap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: контрольные суммы
        run: |
          cd dist
          sha256sum * > checksums.txt

      # Версия cosign закреплена: смена — отдельная правка, как у govulncheck.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      # Подпись сумм, а не каждого архива: архивы проверяются по
      # checksums.txt, как и раньше (формула, install.sh тапа). Бандл
      # (сертификат, подпись, запись прозрачности) — отдельный файл рядом:
      # dist/* уходит в релиз тапа целиком, а в payload события остаётся
      # только checksums.txt — тапу правка не нужна.
      - name: подписать checksums.txt
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      # Здесь — только заметки: архивы CLI живут в публичном релизе тапа,
      # и качают их оттуда.
      # Черновик не нужен: тег ставится, когда релиз уже решён.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # Тап — отдельный репозиторий; токен прогона до него не дотягивается,
      # релиз и событие идут fine-grained PAT с правом Contents на
      # homebrew-tap (секрет TAP_DISPATCH_TOKEN). Повторный прогон того же
      # тега не падает: ассеты перезаписываются.
      - name: выложить архивы в тап
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          cat > notes.md <<'MD'
          Бинарники `clab` и `clab-runner` под macOS, Linux и Windows.

          ```bash
          brew trust cadence-lab-tech/tap && brew install cadence-lab-tech/tap/clab
          # без Homebrew
          curl -fsSL https://raw.githubusercontent.com/cadence-lab-tech/homebrew-tap/main/install.sh | sh
          ```

          Суммы — в `checksums.txt`: `shasum -a 256 -c checksums.txt`.
          Подпись сумм — `checksums.txt.sigstore.json` (cosign 3):

          ```bash
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity https://github.com/cadence-lab-tech/sdlc-pipeline-backend/.github/workflows/release.yml@refs/tags/@TAG@ \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          ```
          MD
          # Тег — в тексте заметок: heredoc в кавычках ничего не подставляет.
          sed -i "s/@TAG@/${GITHUB_REF_NAME}/" notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$TAP" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$TAP" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$TAP" \
              --title "clab ${GITHUB_REF_NAME}" --notes-file notes.md dist/*
          fi

          # В payload — тег и checksums.txt целиком: тапу тогда не нужен
          # доступ к этому репозиторию, формулу он рендерит из
          # события (update.yml там).
          gh api "repos/$TAP/dispatches" \
            -f event_type=clab-release \
            -f "client_payload[tag]=${GITHUB_REF_NAME}" \
            -f "client_payload[checksums]=$(cat dist/checksums.txt)"

      - name: без токена тапа
        if: env.HAS_TAP_TOKEN != 'true'
        run: |
          echo "секрета TAP_DISPATCH_TOKEN нет — архивы не уехали в homebrew-tap"
          echo "и формула не обновилась; руками:"
          echo "  gh release create ${GITHUB_REF_NAME} --repo ${TAP} dist/*"
          echo "  gh workflow run update.yml --repo ${TAP}"

  # Образ версии: ghcr.io/<владелец>/sdlc-pipeline-backend:vX.Y.Z. Тот же
  # Dockerfile, что у deploy.yml, но тег образа и VERSION — имя git-тега:
  # /v1/instance, clab version и VERSION поставки пишут одно и то же.
  # Выкладку нашего инстанса тег не запускает — она идёт из deploy.yml по
  # SHA. Задание не зависит от CLI: архивы и тап выходят, даже если образ
  # не собрался.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # OIDC-токен прогона — для подписи образа и VEX без ключей.
      id-token: write
    env:
      HAS_SELF_HOSTED_TOKEN: ${{ secrets.SELF_HOSTED_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # Образ версии уходит наружу и без лицензии выходить не должен.
      # Dockerfile отсутствие файла терпит — ради сборок по SHA.
      - name: лицензия на месте
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error file=LICENSE::в корне репозитория нет LICENSE — образ ${GITHUB_REF_NAME} без лицензии не публикуется"
            exit 1
          fi

      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Метка source привязывает пакет к репозиторию — видимость в GHCR
      # тогда переключается на пакете целиком.
      #
      # Образ выходит индексом под две платформы: self-hosted ставят и на
      # amd64-серверы, и на arm64 (Graviton, Ampere, Apple Silicon). Go
      # кросс-компилируется на раннере (Dockerfile, GOARCH=$TARGETARCH), QEMU
      # намеренно не подключён: RUN под целевой платформой должен ронять
      # сборку, а не тихо уходить в эмуляцию.
      #
      # SBOM (SPDX, сканер BuildKit) и provenance (SLSA v1) — манифесты
      # аттестаций внутри индекса, по одному на платформу. Режим и версия
      # provenance заданы явно: по умолчанию action даёт max только
      # публичному репозиторию, а версию предиката выбирает BuildKit.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max,version=v1
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.registry }}/sdlc-pipeline-backend:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      # Подписывается digest индекса, не тег: тег в реестре переписываем,
      # digest — нет. Индекс перечисляет манифесты платформ и аттестаций,
      # поэтому подпись покрывает и SBOM с provenance. Клиент проверяет:
      #   cosign verify --certificate-identity <этот release.yml на теге>
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <образ>
      - name: подписать образ
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/sdlc-pipeline-backend@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # Известные ложные находки сканеров (GO-2026-5932 и т. п.) —
      # подписанным OpenVEX рядом с образом. Исходник утверждений правится
      # PR в .github/release/openvex.json, не здесь.
      - name: VEX к образу
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/sdlc-pipeline-backend@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type openvex --predicate .github/release/openvex.json "$IMAGE"

      # То, что увидит клиент со сканером по модулям: govulncheck в
      # бинарном режиме по /api, /worker, /clab из опубликованного образа.
      # Находка вне VEX — предупреждение с ID в сводке прогона, релиз не
      # падает: образ уже опубликован и подписан, а разбор находки — PR
      # (исправление или запись в openvex.json).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck по бинарям образа
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/sdlc-pipeline-backend@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-bin
          id=$(docker create --platform linux/amd64 "$IMAGE")
          for b in api worker clab; do docker cp "$id:/$b" "image-bin/$b"; done
          docker rm "$id" >/dev/null
          .github/release/govulncheck-binaries.sh .github/release/openvex.json image-bin/api image-bin/worker image-bin/clab

      # Событие cadence-release шлёт тот выпуск, который опубликовал и
      # подписал свой образ вторым (см. скрипт): релиз-PR self-hosted пишет
      # digest обоих образов в compose и проверяет их подписи. Без секрета
      # шаг не падает, а печатает команду для отправки руками.
      - name: оповестить self-hosted
        env:
          VERSION: ${{ github.ref_name }}
          REGISTRY: ${{ steps.meta.outputs.registry }}
          SELF: backend
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNED: "true"
          HAS_TOKEN: ${{ env.HAS_SELF_HOSTED_TOKEN }}
          GH_TOKEN: ${{ secrets.SELF_HOSTED_DISPATCH_TOKEN }}
        run: .github/release/notify-self-hosted.sh
