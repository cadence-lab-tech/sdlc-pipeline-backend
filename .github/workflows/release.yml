# Релиз clab: бинарники под три платформы по тегу v*, формула в тап Homebrew.
#
# CLI ставят на машины разработчиков, где нет ни Go, ни доступа к GHCR, —
# поэтому не образ, а готовые архивы в GitHub Releases. Репозиторий
# приватный: скачивает участник организации — brew с его токеном GitHub,
# install.sh из тапа или gh release download. Формулу Homebrew держит и
# обновляет тап cadence-lab-tech/homebrew-tap; отсюда ему уходит событие.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Версия в бинарнике — имя тега, чтобы clab version отвечал тем же,
      # что и страница релиза.
      - name: собрать
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          name="clab_${version}_${GOOS}_${GOARCH}"
          mkdir -p dist/"$name"
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o dist/"$name"/clab"$ext" ./cmd/clab
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o dist/"$name"/clab-runner"$ext" ./cmd/clab-runner
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      # Секреты в условии шага недоступны, поэтому флаг считается здесь.
      # Без токена релиз всё равно выходит — только тап о нём не узнает.
      HAS_TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: контрольные суммы
        run: |
          cd dist
          sha256sum * > checksums.txt

      # Черновик не нужен: тег ставится, когда релиз уже решён.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Тап — отдельный репозиторий; токен прогона до него не дотягивается,
      # событие шлётся fine-grained PAT с правом Contents на homebrew-tap
      # (секрет TAP_DISPATCH_TOKEN). В payload — тег и checksums.txt целиком:
      # тапу тогда не нужен доступ к этому приватному репозиторию, формулу
      # он рендерит из события (update.yml там).
      - name: сообщить тапу
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          gh api repos/cadence-lab-tech/homebrew-tap/dispatches \
            -f event_type=clab-release \
            -f "client_payload[tag]=${GITHUB_REF_NAME}" \
            -f "client_payload[checksums]=$(cat dist/checksums.txt)"

      - name: без токена тапа
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "секрета TAP_DISPATCH_TOKEN нет — формула в homebrew-tap не обновится; руками: gh workflow run update.yml --repo cadence-lab-tech/homebrew-tap"
