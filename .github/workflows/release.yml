# Релиз clab: бинарники под три платформы по тегу v*, формула в тап Homebrew.
#
# CLI ставят на машины разработчиков, где нет ни Go, ни доступа к GHCR, —
# поэтому не образ, а готовые архивы в GitHub Releases. Раздача публичная
# (решение 0038): архивы уходят релизом в публичный тап
# cadence-lab-tech/homebrew-tap, откуда их качают brew, install.sh и просто
# curl — без токена и без участия в организации. Код сервиса остаётся
# закрытым: здесь у релиза только заметки о том, что изменилось.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Версия в бинарнике — имя тега, чтобы clab version отвечал тем же,
      # что и страница релиза.
      - name: собрать
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          name="clab_${version}_${GOOS}_${GOARCH}"
          mkdir -p dist/"$name"
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o dist/"$name"/clab"$ext" ./cmd/clab
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o dist/"$name"/clab-runner"$ext" ./cmd/clab-runner
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      # Секреты в условии шага недоступны, поэтому флаг считается здесь.
      # Без токена заметки всё равно выходят — только архивы до тапа не
      # доедут и формула не обновится.
      HAS_TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN != '' }}
      TAP: cadence-lab-tech/homebrew-tap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: контрольные суммы
        run: |
          cd dist
          sha256sum * > checksums.txt

      # Здесь — только заметки: архивы лежат в публичном релизе тапа, а
      # этот репозиторий приватный, и качать из него никто не должен.
      # Черновик не нужен: тег ставится, когда релиз уже решён.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # Тап — отдельный репозиторий; токен прогона до него не дотягивается,
      # релиз и событие идут fine-grained PAT с правом Contents на
      # homebrew-tap (секрет TAP_DISPATCH_TOKEN). Повторный прогон того же
      # тега не падает: ассеты перезаписываются.
      - name: выложить архивы в тап
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          cat > notes.md <<'MD'
          Бинарники `clab` и `clab-runner` под macOS, Linux и Windows.

          ```bash
          brew trust cadence-lab-tech/tap && brew install cadence-lab-tech/tap/clab
          # без Homebrew
          curl -fsSL https://raw.githubusercontent.com/cadence-lab-tech/homebrew-tap/main/install.sh | sh
          ```

          Суммы — в `checksums.txt`: `shasum -a 256 -c checksums.txt`.
          MD
          if gh release view "$GITHUB_REF_NAME" --repo "$TAP" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$TAP" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$TAP" \
              --title "clab ${GITHUB_REF_NAME}" --notes-file notes.md dist/*
          fi

          # В payload — тег и checksums.txt целиком: тапу тогда не нужен
          # доступ к этому приватному репозиторию, формулу он рендерит из
          # события (update.yml там).
          gh api "repos/$TAP/dispatches" \
            -f event_type=clab-release \
            -f "client_payload[tag]=${GITHUB_REF_NAME}" \
            -f "client_payload[checksums]=$(cat dist/checksums.txt)"

      - name: без токена тапа
        if: env.HAS_TAP_TOKEN != 'true'
        run: |
          echo "секрета TAP_DISPATCH_TOKEN нет — архивы не уехали в homebrew-tap"
          echo "и формула не обновилась; руками:"
          echo "  gh release create ${GITHUB_REF_NAME} --repo ${TAP} dist/*"
          echo "  gh workflow run update.yml --repo ${TAP}"
