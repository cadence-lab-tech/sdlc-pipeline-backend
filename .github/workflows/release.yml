# Релиз clab: бинарники под три платформы по тегу v*.
#
# CLI ставят на машины разработчиков, где нет ни Go, ни доступа к GHCR, —
# поэтому не образ, а готовые архивы в GitHub Releases. Репозиторий
# приватный: скачивает участник организации через gh release download.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Версия в бинарнике — имя тега, чтобы clab version отвечал тем же,
      # что и страница релиза.
      - name: собрать
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          name="clab_${version}_${GOOS}_${GOARCH}"
          mkdir -p dist/"$name"
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o dist/"$name"/clab"$ext" ./cmd/clab
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o dist/"$name"/clab-runner"$ext" ./cmd/clab-runner
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: контрольные суммы
        run: |
          cd dist
          sha256sum * > checksums.txt

      # Черновик не нужен: тег ставится, когда релиз уже решён.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
