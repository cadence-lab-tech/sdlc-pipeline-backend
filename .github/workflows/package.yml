# Проверка пакета self-hosted с clab ветки (CLAB-253).
#
# Что проверяет. Скрипты пакета (install.sh, upgrade.sh, backup.sh,
# restore.sh) — обёртки `clab server` того clab, что лежит в пакете в
# bin/ (решение 0057). CI пакета (check.yml в self-hosted) кладёт туда clab
# версии VERSION из тапа, поэтому изменение `clab server` впервые проходит
# проверку пакетом на релиз-PR, когда теги уже стоят (так было с CLAB-252).
# Здесь clab собирается из ветки PR под четыре платформы с версией VERSION
# пакета и уходит в пакет через CHECK_CLAB_DIR пакетного ci/check-stack.sh
# (ci/package.sh --clab): установка, бэкап, восстановление, апгрейды,
# «внешний» clab и стартовый проект идут на коде ветки, а стек — на
# опубликованных образах VERSION. Два прогона параллельно: секреты в .env и
# в файлах (CHECK_SECRETS=files, secrets/admin_token 65532:65532, 400 по
# docs/admin.md). Одна архитектура — amd64; arm64 и внешнюю базу проверяет
# check.yml пакета.
#
# Пакет берётся с ветки self-hosted, у которой то же имя, что у ветки PR
# (clab/<ключ>-<slug> — одна ветка задачи в обоих репозиториях), иначе с
# main; ручной запуск принимает ref явно. Задача, которая меняет clab server
# и проверки пакета вместе, проверяется своей парой веток.
#
# Предел: образы — VERSION пакета, не ветки. clab ветки, который зовёт API,
# которого в этих образах ещё нет, краснеет по делу; такую пару проверяет
# релиз-PR self-hosted.
#
# Почему по путям. Прогон занимает минуты и нужен только PR, который меняет
# код clab server: файлы cmd/clab/server*, то, на что они опираются вне
# server* (main.go, client.go, output.go, version.go, proc_unix.go), и
# internal/secrets. Тесты (*_test.go) в бинарь не попадают и прогона не
# зовут; go.mod и go.sum — тоже нет: зависимости проверяет ci.yml, а PR
# Dependabot не должны гонять пакет. Отдельный файл, а не job в ci.yml:
# deploy.yml ждёт весь прогон ci.yml по SHA, а у ci.yml фильтра путей нет
# намеренно.
#
# Почему не обязательная проверка защиты main. С фильтром путей PR без этих
# путей прогона не получает, и обязательная проверка повисла бы в
# «expected» (см. шапку ci.yml). Красный прогон виден в PR и держит его
# слияние по договорённости, а не по защите.
#
# Без секретов и записи: права — чтение, self-hosted публичный, образы
# VERSION в GHCR и clab тапа публичные; образы ветки не собираются и не
# публикуются.
name: package

on:
  pull_request:
    paths:
      - cmd/clab/server*.go
      - cmd/clab/main.go
      - cmd/clab/client.go
      - cmd/clab/output.go
      - cmd/clab/version.go
      - cmd/clab/proc_unix.go
      - internal/secrets/**
      - .github/workflows/package.yml
      - "!cmd/clab/*_test.go"
      - "!internal/secrets/**/*_test.go"
  workflow_dispatch:
    inputs:
      self_hosted_ref:
        description: "Ветка или тег cadence-lab-tech/self-hosted; пусто — ветка с тем же именем, иначе main"
        required: false

permissions:
  contents: read

# Новый push в PR отменяет прогон предыдущего коммита.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package (secrets in ${{ matrix.secrets }})
    strategy:
      fail-fast: false
      matrix:
        secrets: [env, files]
    # Раннер закреплён, как у ci.yml (CLAB-151).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # ref self-hosted: вход ручного запуска, иначе ветка с именем ветки
      # backend (head_ref у PR, ref_name у ручного запуска), если она есть,
      # иначе main.
      - id: ref
        name: self-hosted ref
        env:
          INPUT_REF: ${{ inputs.self_hosted_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
            why="the input self_hosted_ref"
          elif git ls-remote --exit-code --heads https://github.com/cadence-lab-tech/self-hosted "refs/heads/$BRANCH" >/dev/null; then
            ref="$BRANCH"
            why="the branch of the same name as $BRANCH"
          else
            ref=main
            why="no branch $BRANCH in self-hosted"
          fi
          echo "self-hosted ref: $ref ($why)"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: cadence-lab-tech/self-hosted
          ref: ${{ steps.ref.outputs.ref }}
          path: self-hosted
          persist-credentials: false

      # Ветка self-hosted без CHECK_CLAB_DIR собрала бы пакет с clab тапа и
      # позеленела, ничего не проверив: отказ с причиной.
      - name: check-stack takes CHECK_CLAB_DIR
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          if ! grep -q CHECK_CLAB_DIR self-hosted/ci/check-stack.sh; then
            echo "::error::ci/check-stack.sh of self-hosted $REF has no CHECK_CLAB_DIR (CLAB-253): merge main of self-hosted into the branch"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # clab ветки под четыре платформы пакета (CLAB_PLATFORMS в ci/lib.sh
      # пакета) с версией VERSION пакета, как release.yml: check-stack
      # сверяет `clab <VERSION>`.
      - name: clab of the branch as VERSION of the package
        run: |
          version="$(tr -d '[:space:]' <self-hosted/VERSION)"
          dir="$RUNNER_TEMP/clab-bin"
          mkdir -p "$dir"
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${p%/*}" GOARCH="${p#*/}" \
              go build -trimpath -ldflags="-s -w -X main.version=${version}" \
              -o "$dir/clab-${p%/*}-${p#*/}" ./cmd/clab
          done
          "$dir/clab-linux-amd64" version | head -n 1
          echo "CHECK_CLAB_DIR=$dir" >>"$GITHUB_ENV"

      # cosign той же версии, что в check.yml пакета: установщик проверяет
      # подписи образов VERSION по-настоящему (CADENCE_VERIFY=auto).
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: stack on the images of VERSION with the clab of the branch
        env:
          CHECK_SECRETS: ${{ matrix.secrets }}
        run: self-hosted/ci/check-stack.sh
